name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - id: swift-version
        run: echo "version=$(swift --version 2>&1 | head -n 1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            .build/tools
            Tools/StatementPadding/.build
          key: lint-tools-${{ runner.os }}-${{ steps.swift-version.outputs.version }}-${{ hashFiles('Makefile', 'scripts/fetch-swiftlint.sh', 'Tools/StatementPadding/Package.swift', 'Tools/StatementPadding/Package.resolved', 'Tools/StatementPadding/Sources/**') }}
      - run: make lint
      - run: swift test
      - run: make bundle
