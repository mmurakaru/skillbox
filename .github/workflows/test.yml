name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v6
        with:
          path: |
            .build/tools
            Tools/StatementPadding/.build
          key: lint-tools-${{ runner.os }}-${{ hashFiles('Makefile', 'Tools/StatementPadding/Package.resolved', 'Tools/StatementPadding/Sources/**') }}
      - run: make lint
      - run: swift test
      - run: make bundle
